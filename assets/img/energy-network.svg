<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Connected sustainable energy system</title><desc id="desc">Illustration of renewable generation, an electric vehicle, a battery and a connected power grid.</desc>
<defs>
